name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  debug-build:
    name: Debug build (every push/PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Run Rust unit tests
        working-directory: app/src/main/rust
        run: cargo test

      # No local Gradle wrapper is committed to this repo, so instead of
      # ./gradlew (which needs gradlew + gradle-wrapper.jar present),
      # this installs and caches Gradle itself, then calls it directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vmgsi-debug
          path: app/build/outputs/apk/debug/*.apk

  release-build:
    name: Signed release build (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: debug-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Same pattern as the TapMacro repo: keystore stored base64-encoded in
      # secrets, decoded at build time, never committed to the repo.
      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: vmgsi-release
          path: app/build/outputs/apk/release/*.apk

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore
